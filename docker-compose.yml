services:
  new-api:
    image: ghcr.io/biubiubiu125/newapi:main
    container_name: ${CONTAINER_PREFIX:-newapi}-app
    restart: always
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command: --log-dir /app/logs
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@newapi-postgres:5432/${POSTGRES_DB:-new-api}
#      - LOG_SQL_DSN=clickhouse://default:${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}@newapi-clickhouse:9000/${CLICKHOUSE_DB:-new_api_logs}
#      - LOG_SQL_CLICKHOUSE_TTL_DAYS=${LOG_SQL_CLICKHOUSE_TTL_DAYS:-0}
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@newapi-redis:6379
      - SESSION_SECRET=${SESSION_SECRET:?set SESSION_SECRET in .env}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - SESSION_COOKIE_TRUSTED_URL=${SESSION_COOKIE_TRUSTED_URL:-}
      - USER_SESSION_ACTIVE_LIMIT=${USER_SESSION_ACTIVE_LIMIT:-50}
      - USER_SESSION_ISSUANCE_LIMIT=${USER_SESSION_ISSUANCE_LIMIT:-100}
      - USER_SESSION_ISSUANCE_WINDOW_SECONDS=${USER_SESSION_ISSUANCE_WINDOW_SECONDS:-86400}
      - USER_SESSION_REVOKED_RETENTION_DAYS=${USER_SESSION_REVOKED_RETENTION_DAYS:-7}
      - USER_SESSION_HOURLY_ALERT_THRESHOLD=${USER_SESSION_HOURLY_ALERT_THRESHOLD:-5000}
      - TZ=${TZ:-Asia/Shanghai}
      - ERROR_LOG_ENABLED=${ERROR_LOG_ENABLED:-true}
      - DB_STARTUP_CONNECT_TIMEOUT_SECONDS=${DB_STARTUP_CONNECT_TIMEOUT_SECONDS:-60}
      - DB_STARTUP_CONNECT_RETRY_INTERVAL_MS=${DB_STARTUP_CONNECT_RETRY_INTERVAL_MS:-1000}
      - BATCH_UPDATE_ENABLED=${BATCH_UPDATE_ENABLED:-false}
      - TRUST_QUOTA=${TRUST_QUOTA:-0}
      - NODE_NAME=${NODE_NAME:-new-api-node-1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - TRUSTED_REDIRECT_DOMAINS=${TRUSTED_REDIRECT_DOMAINS:-}
      - REFERRAL_TEST_MODE=${REFERRAL_TEST_MODE:-false}
      - GLOBAL_WEB_RATE_LIMIT_ENABLE=${GLOBAL_WEB_RATE_LIMIT_ENABLE:-true}
      - GLOBAL_WEB_RATE_LIMIT=${GLOBAL_WEB_RATE_LIMIT:-600}
      - GLOBAL_WEB_RATE_LIMIT_DURATION=${GLOBAL_WEB_RATE_LIMIT_DURATION:-180}
      - GLOBAL_API_RATE_LIMIT_ENABLE=${GLOBAL_API_RATE_LIMIT_ENABLE:-true}
      - GLOBAL_API_RATE_LIMIT=${GLOBAL_API_RATE_LIMIT:-180}
      - GLOBAL_API_RATE_LIMIT_DURATION=${GLOBAL_API_RATE_LIMIT_DURATION:-180}
      - CRITICAL_RATE_LIMIT_ENABLE=${CRITICAL_RATE_LIMIT_ENABLE:-true}
      - CRITICAL_RATE_LIMIT=${CRITICAL_RATE_LIMIT:-50}
      - CRITICAL_RATE_LIMIT_DURATION=${CRITICAL_RATE_LIMIT_DURATION:-1200}
      # 图片异步任务，详见 docs/image-tasks.md
      - UPDATE_TASK=${UPDATE_TASK:-true}
      - TASK_TIMEOUT_MINUTES=${TASK_TIMEOUT_MINUTES:-1440}
      - IMAGE_TASK_WORKER_ENABLED=${IMAGE_TASK_WORKER_ENABLED:-true}
      - IMAGE_TASK_WORKER_IDLE_SECONDS=${IMAGE_TASK_WORKER_IDLE_SECONDS:-5}
      - IMAGE_TASK_WORKER_CONCURRENCY=${IMAGE_TASK_WORKER_CONCURRENCY:-0}
      - IMAGE_TASK_CHANNEL_CONCURRENCY=${IMAGE_TASK_CHANNEL_CONCURRENCY:-0}
      - IMAGE_TASK_BATCH_POLL_SIZE=${IMAGE_TASK_BATCH_POLL_SIZE:-20}
      - IMAGE_TASK_LEASE_SECONDS=${IMAGE_TASK_LEASE_SECONDS:-120}
      - IMAGE_TASK_RESULT_RETENTION_MINUTES=${IMAGE_TASK_RESULT_RETENTION_MINUTES:-4320}
      - IMAGE_TASK_ORPHAN_FAIL_SECONDS=${IMAGE_TASK_ORPHAN_FAIL_SECONDS:-1800}
      - IMAGE_TASK_RESULT_INLINE_MAX_MB=${IMAGE_TASK_RESULT_INLINE_MAX_MB:-32}
      - IMAGE_TASK_RESULT_DOWNLOAD_CONCURRENCY=${IMAGE_TASK_RESULT_DOWNLOAD_CONCURRENCY:-32}
      - IMAGE_TASK_RESULT_DOWNLOAD_TOKEN_CONCURRENCY=${IMAGE_TASK_RESULT_DOWNLOAD_TOKEN_CONCURRENCY:-4}
      - IMAGE_TASK_ACCESS_RATE_LIMIT=${IMAGE_TASK_ACCESS_RATE_LIMIT:-600}
      - IMAGE_TASK_ACCESS_RATE_LIMIT_DURATION=${IMAGE_TASK_ACCESS_RATE_LIMIT_DURATION:-60}
      - IMAGE_TASK_CREATE_RATE_LIMIT=${IMAGE_TASK_CREATE_RATE_LIMIT:-60}
      - IMAGE_TASK_CREATE_RATE_LIMIT_DURATION=${IMAGE_TASK_CREATE_RATE_LIMIT_DURATION:-60}
      - IMAGE_TASK_CREATE_MAX_IN_FLIGHT=${IMAGE_TASK_CREATE_MAX_IN_FLIGHT:-16}
      - IMAGE_TASK_CREATE_MAX_RESERVED_MB=${IMAGE_TASK_CREATE_MAX_RESERVED_MB:-1024}
      - IMAGE_TASK_IDEMPOTENCY_LOCK_RETENTION_HOURS=${IMAGE_TASK_IDEMPOTENCY_LOCK_RETENTION_HOURS:-720}
      - IMAGE_TASK_HTTP_RESPONSE_MAX_MB=${IMAGE_TASK_HTTP_RESPONSE_MAX_MB:-0}
      - IMAGE_TASK_FILE_CACHE_SHARED=${IMAGE_TASK_FILE_CACHE_SHARED:-false}
      - IMAGE_TASK_FILE_CACHE_SHARED_TRUSTED=${IMAGE_TASK_FILE_CACHE_SHARED_TRUSTED:-false}
      - IMAGE_TASK_LOCAL_FILE_CACHE_AFFINITY=${IMAGE_TASK_LOCAL_FILE_CACHE_AFFINITY:-true}
      - IMAGE_TASK_REQUEST_BODY_BASE64_MAX_MB=${IMAGE_TASK_REQUEST_BODY_BASE64_MAX_MB:-16}
    depends_on:
      newapi-redis:
        condition: service_healthy
      newapi-postgres:
        condition: service_healthy
#      newapi-clickhouse:
#        condition: service_started
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  newapi-redis:
    image: redis:7-alpine
    container_name: ${CONTAINER_PREFIX:-newapi}-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - new-api-network

  newapi-postgres:
    image: postgres:15-alpine
    container_name: ${CONTAINER_PREFIX:-newapi}-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-new-api}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-new-api}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - new-api-network

#  newapi-clickhouse:
#    image: clickhouse/clickhouse-server:24.8
#    container_name: ${CONTAINER_PREFIX:-newapi}-clickhouse
#    restart: always
#    environment:
#      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-new_api_logs}
#      CLICKHOUSE_USER: default
#      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
#      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
