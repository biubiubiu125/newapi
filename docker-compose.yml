#      - clickhouse_data:/var/lib/clickhouse
#    networks:
#      - new-api-network
#    ports:
#      - "8123:8123"
#      - "9000:9000"

volumes:
  pg_data:
#  clickhouse_data:

networks:
  new-api-network:
    driver: bridge
