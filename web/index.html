<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>RK API</title>
    <meta name="title" content="RK API" />
    <script>
      (function () {
        try {
          function canonicalName(name) {
            if (typeof name !== 'string') return ''
            name = name.trim()
            if (!name) return ''
            var compact = name.toLowerCase().replace(/\s+/g, '')
            if (compact === 'newapi' || compact === 'rkapi') return 'RK API'
            return name
          }
          var name = canonicalName(localStorage.getItem('system_name'))
          if (!name) {
            var raw = localStorage.getItem('status')
            if (raw) {
              var status = JSON.parse(raw)
              name = canonicalName(status && status.system_name)
            }
          }
          if (name) {
            document.title = name
            var meta = document.querySelector('meta[name="title"]')
            if (meta) meta.setAttribute('content', name)
          }
        } catch (e) {}
      })()
    </script>
    <meta
      name="description"
      content="统一的 AI API 网关与管理控制台。"
    />

    <meta name="theme-color" content="#fff" />
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
